<svg xmlns="http://www.w3.org/2000/svg" width="672" height="452" viewBox="0 0 672 452" role="img" aria-label="一般做法在存進資料庫和發布事件之間掛掉會漏送；Transactional Outbox 把訊息和待發布事件寫在同一個 transaction，由背景程式負責發布">
<title>一般做法在存進資料庫和發布事件之間掛掉會漏送；Transactional Outbox 把訊息和待發布事件寫在同一個 transaction，由背景程式負責發布</title>

<style>
  .bg { fill: #fafafa; }
  .card { fill: #ffffff; stroke: #e4e4e7; }
  .box { fill: #ffffff; stroke: #a1a1aa; stroke-width: 1.25; }
  .box-dim { fill: #fafafa; stroke: #d4d4d8; stroke-width: 1.25; }
  .box-accent { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.25; }
  .group { fill: none; stroke: #a1a1aa; stroke-width: 1.25; stroke-dasharray: 4 3; }
  .t { fill: #18181b; font: 500 13px -apple-system, BlinkMacSystemFont, 'PingFang TC', 'Noto Sans TC', 'Microsoft JhengHei', sans-serif; }
  .t-strong { fill: #18181b; font: 600 14px -apple-system, BlinkMacSystemFont, 'PingFang TC', 'Noto Sans TC', 'Microsoft JhengHei', sans-serif; }
  .t2 { fill: #52525b; font: 400 12.5px -apple-system, BlinkMacSystemFont, 'PingFang TC', 'Noto Sans TC', 'Microsoft JhengHei', sans-serif; }
  .t3 { fill: #a1a1aa; font: 400 11.5px -apple-system, BlinkMacSystemFont, 'PingFang TC', 'Noto Sans TC', 'Microsoft JhengHei', sans-serif; }
  .t-dim { fill: #a1a1aa; font: 500 13px -apple-system, BlinkMacSystemFont, 'PingFang TC', 'Noto Sans TC', 'Microsoft JhengHei', sans-serif; }
  .code { fill: #52525b; font: 400 11.5px ui-monospace, SFMono-Regular, Menlo, monospace; }
  .life { stroke: #d4d4d8; stroke-width: 1.25; stroke-dasharray: 3 3; }
  .axis { stroke: #d4d4d8; stroke-width: 1; }
  .line { stroke: #71717a; stroke-width: 1.5; fill: none; }
  .line-dim { stroke: #d4d4d8; stroke-width: 1.5; fill: none; }
  .ev { stroke: #2563eb; stroke-width: 1.75; fill: none; }
  .bad { stroke: #dc2626; stroke-width: 1.5; fill: none; stroke-dasharray: 4 3; }
  .bad-solid { stroke: #dc2626; stroke-width: 2; fill: none; }
  .dot { fill: #2563eb; }
  .band { fill: #2563eb; fill-opacity: 0.08; }
  .hold { fill: #a1a1aa; fill-opacity: 0.35; }
  .bar-bad { fill: #dc2626; }
  .bar-ok { fill: #2563eb; }
  .head-line { fill: #71717a; }
  .head-ev { fill: #2563eb; }
  .head-bad { fill: #dc2626; }
  .head-dim { fill: #d4d4d8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #18181b; }
    .card { fill: #09090b; stroke: #27272a; }
    .box { fill: #18181b; stroke: #52525b; }
    .box-dim { fill: #18181b; stroke: #3f3f46; }
    .box-accent { fill: #172554; stroke: #3b82f6; }
    .group { stroke: #52525b; }
    .t, .t-strong { fill: #fafafa; }
    .t2, .code { fill: #a1a1aa; }
    .t3, .t-dim { fill: #71717a; }
    .life, .axis { stroke: #3f3f46; }
    .line { stroke: #a1a1aa; }
    .line-dim { stroke: #52525b; }
    .ev { stroke: #3b82f6; }
    .bad, .bad-solid { stroke: #ef4444; }
    .dot, .bar-ok { fill: #3b82f6; }
    .band { fill: #3b82f6; fill-opacity: 0.14; }
    .hold { fill: #71717a; fill-opacity: 0.4; }
    .bar-bad { fill: #ef4444; }
    .head-line { fill: #a1a1aa; }
    .head-ev { fill: #3b82f6; }
    .head-bad { fill: #ef4444; }
    .head-dim { fill: #52525b; }
  }
</style>
<defs>
  <marker id="a-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head-line" d="M0 0 L10 5 L0 10 z"/></marker>
  <marker id="a-ev" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head-ev" d="M0 0 L10 5 L0 10 z"/></marker>
  <marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head-bad" d="M0 0 L10 5 L0 10 z"/></marker>
  <marker id="a-dim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head-dim" d="M0 0 L10 5 L0 10 z"/></marker>
</defs>

<rect class="bg" width="672" height="452"/>
<rect class="card" x="16" y="16" width="640" height="184" rx="10"/>
<text class="t-strong" x="32" y="42" text-anchor="start">一般做法</text>
<rect class="box" x="40" y="72" width="96" height="40" rx="7"/><text class="t" x="88" y="96.5" text-anchor="middle">Server</text>
<rect class="box" x="216" y="72" width="96" height="40" rx="7"/><text class="t" x="264" y="96.5" text-anchor="middle">資料庫</text>
<rect class="box-accent" x="392" y="72" width="96" height="40" rx="7"/><text class="t" x="440" y="96.5" text-anchor="middle">Broker</text>
<rect class="box" x="544" y="72" width="96" height="40" rx="7"/><text class="t" x="592" y="96.5" text-anchor="middle">各台 Server</text>
<line class="line" x1="136" y1="92" x2="214" y2="92" marker-end="url(#a-line)"/>
<text class="t2" x="176" y="84" text-anchor="middle">① 存訊息</text>
<path class="line" d="M 88 112 V 138 H 440 V 114" marker-end="url(#a-line)"/>
<text class="t2" x="352" y="156" text-anchor="middle">② 發布事件</text>
<line class="bad-solid" x1="234" y1="132" x2="246" y2="144"/><line class="bad-solid" x1="234" y1="144" x2="246" y2="132"/>
<line class="ev" x1="488" y1="92" x2="542" y2="92" marker-end="url(#a-ev)"/>
<text class="t2" x="515" y="84" text-anchor="middle">③</text>
<text class="t3" x="32" y="186" text-anchor="start">Server 在 ① 之後、② 之前掛掉 (✕)，事件就不會即時送到 Client。</text>
<rect class="card" x="16" y="216" width="640" height="220" rx="10"/>
<text class="t-strong" x="32" y="242" text-anchor="start">Transactional Outbox</text>
<rect class="group" x="176" y="266" width="176" height="96" rx="8"/>
<text class="t3" x="264" y="283" text-anchor="middle">同一個 transaction</text>
<rect class="box" x="190" y="292" width="148" height="28" rx="7"/><text class="t" x="264" y="310.5" text-anchor="middle">訊息</text>
<rect class="box" x="190" y="326" width="148" height="28" rx="7"/><text class="t" x="264" y="344.5" text-anchor="middle">待發布事件</text>
<rect class="box" x="40" y="320" width="88" height="40" rx="7"/><text class="t" x="84" y="344.5" text-anchor="middle">Server</text>
<line class="line" x1="128" y1="340" x2="174" y2="340" marker-end="url(#a-line)"/>
<text class="t2" x="151" y="332" text-anchor="middle">①</text>
<rect class="box" x="400" y="320" width="96" height="40" rx="7"/><text class="t" x="448" y="344.5" text-anchor="middle">背景程式</text>
<line class="line" x1="338" y1="340" x2="398" y2="340" marker-end="url(#a-line)"/>
<text class="t2" x="375" y="332" text-anchor="middle">②</text>
<rect class="box-accent" x="544" y="320" width="96" height="40" rx="7"/><text class="t" x="592" y="344.5" text-anchor="middle">Broker</text>
<line class="ev" x1="496" y1="340" x2="542" y2="340" marker-end="url(#a-ev)"/>
<text class="t2" x="519" y="332" text-anchor="middle">②</text>
<path class="line" d="M 448 360 V 384 H 264 V 364" marker-end="url(#a-line)"/>
<text class="t2" x="356" y="402" text-anchor="middle">③</text>
<text class="t3" x="32" y="418" text-anchor="start">① 寫入，② 讀取並發布，③ 標記已發布。Server 在哪一步掛掉，待發布事件都還在資料庫裡。</text>
</svg>
