<svg xmlns="http://www.w3.org/2000/svg" width="672" height="588" viewBox="0 0 672 588" role="img" aria-label="SSE 擴展到多台 Server 的四個步驟：單台、兩台收不到、加上 Broker 廣播、查連線位置表只發給需要的 Server">
<title>SSE 擴展到多台 Server 的四個步驟：單台、兩台收不到、加上 Broker 廣播、查連線位置表只發給需要的 Server</title>

<style>
  .bg { fill: #fafafa; }
  .card { fill: #ffffff; stroke: #e4e4e7; }
  .box { fill: #ffffff; stroke: #a1a1aa; stroke-width: 1.25; }
  .box-dim { fill: #fafafa; stroke: #d4d4d8; stroke-width: 1.25; }
  .box-accent { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.25; }
  .group { fill: none; stroke: #a1a1aa; stroke-width: 1.25; stroke-dasharray: 4 3; }
  .t { fill: #18181b; font: 500 13px -apple-system, BlinkMacSystemFont, 'PingFang TC', 'Noto Sans TC', 'Microsoft JhengHei', sans-serif; }
  .t-strong { fill: #18181b; font: 600 14px -apple-system, BlinkMacSystemFont, 'PingFang TC', 'Noto Sans TC', 'Microsoft JhengHei', sans-serif; }
  .t2 { fill: #52525b; font: 400 12.5px -apple-system, BlinkMacSystemFont, 'PingFang TC', 'Noto Sans TC', 'Microsoft JhengHei', sans-serif; }
  .t3 { fill: #a1a1aa; font: 400 11.5px -apple-system, BlinkMacSystemFont, 'PingFang TC', 'Noto Sans TC', 'Microsoft JhengHei', sans-serif; }
  .t-dim { fill: #a1a1aa; font: 500 13px -apple-system, BlinkMacSystemFont, 'PingFang TC', 'Noto Sans TC', 'Microsoft JhengHei', sans-serif; }
  .code { fill: #52525b; font: 400 11.5px ui-monospace, SFMono-Regular, Menlo, monospace; }
  .life { stroke: #d4d4d8; stroke-width: 1.25; stroke-dasharray: 3 3; }
  .axis { stroke: #d4d4d8; stroke-width: 1; }
  .line { stroke: #71717a; stroke-width: 1.5; fill: none; }
  .line-dim { stroke: #d4d4d8; stroke-width: 1.5; fill: none; }
  .ev { stroke: #2563eb; stroke-width: 1.75; fill: none; }
  .bad { stroke: #dc2626; stroke-width: 1.5; fill: none; stroke-dasharray: 4 3; }
  .bad-solid { stroke: #dc2626; stroke-width: 2; fill: none; }
  .dot { fill: #2563eb; }
  .band { fill: #2563eb; fill-opacity: 0.08; }
  .hold { fill: #a1a1aa; fill-opacity: 0.35; }
  .bar-bad { fill: #dc2626; }
  .bar-ok { fill: #2563eb; }
  .head-line { fill: #71717a; }
  .head-ev { fill: #2563eb; }
  .head-bad { fill: #dc2626; }
  .head-dim { fill: #d4d4d8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #18181b; }
    .card { fill: #09090b; stroke: #27272a; }
    .box { fill: #18181b; stroke: #52525b; }
    .box-dim { fill: #18181b; stroke: #3f3f46; }
    .box-accent { fill: #172554; stroke: #3b82f6; }
    .group { stroke: #52525b; }
    .t, .t-strong { fill: #fafafa; }
    .t2, .code { fill: #a1a1aa; }
    .t3, .t-dim { fill: #71717a; }
    .life, .axis { stroke: #3f3f46; }
    .line { stroke: #a1a1aa; }
    .line-dim { stroke: #52525b; }
    .ev { stroke: #3b82f6; }
    .bad, .bad-solid { stroke: #ef4444; }
    .dot, .bar-ok { fill: #3b82f6; }
    .band { fill: #3b82f6; fill-opacity: 0.14; }
    .hold { fill: #71717a; fill-opacity: 0.4; }
    .bar-bad { fill: #ef4444; }
    .head-line { fill: #a1a1aa; }
    .head-ev { fill: #3b82f6; }
    .head-bad { fill: #ef4444; }
    .head-dim { fill: #52525b; }
  }
</style>
<defs>
  <marker id="a-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head-line" d="M0 0 L10 5 L0 10 z"/></marker>
  <marker id="a-ev" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head-ev" d="M0 0 L10 5 L0 10 z"/></marker>
  <marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head-bad" d="M0 0 L10 5 L0 10 z"/></marker>
  <marker id="a-dim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head-dim" d="M0 0 L10 5 L0 10 z"/></marker>
</defs>

<rect class="bg" width="672" height="588"/>
<rect class="card" x="16" y="16" width="312" height="270" rx="10"/>
<g transform="translate(50 0)"><rect class="box" x="128" y="99" width="84" height="34" rx="7"/><text class="t" x="170" y="120.5" text-anchor="middle">Server</text>
<line class="ev" x1="170" y1="42" x2="170" y2="97" marker-end="url(#a-ev)"/><text class="t2" x="180" y="54" text-anchor="start">事件</text>
<rect class="box" x="32" y="55" width="72" height="30" rx="7"/><text class="t" x="68" y="74.5" text-anchor="middle">用戶 1</text>
<line class="ev" x1="128" y1="116" x2="106" y2="70" marker-end="url(#a-ev)"/>
<rect class="box" x="32" y="101" width="72" height="30" rx="7"/><text class="t" x="68" y="120.5" text-anchor="middle">用戶 2</text>
<line class="ev" x1="128" y1="116" x2="106" y2="116" marker-end="url(#a-ev)"/>
<rect class="box" x="32" y="147" width="72" height="30" rx="7"/><text class="t" x="68" y="166.5" text-anchor="middle">用戶 3</text>
<line class="ev" x1="128" y1="116" x2="106" y2="162" marker-end="url(#a-ev)"/></g><text class="t3" x="36" y="216" text-anchor="start">第 1 步：單台 Server</text><text class="t2" x="36" y="236" text-anchor="start">事件和所有連線都在同一台，直接逐條寫出去，</text><text class="t2" x="36" y="255" text-anchor="start">沒有問題。</text>
<rect class="card" x="344" y="16" width="312" height="270" rx="10"/>
<g transform="translate(5.375 0)"><rect class="box" x="456" y="79" width="84" height="34" rx="7"/><text class="t" x="498" y="100.5" text-anchor="middle">Server A</text>
<rect class="box" x="456" y="149" width="84" height="34" rx="7"/><text class="t" x="498" y="170.5" text-anchor="middle">Server B</text>
<line class="ev" x1="498" y1="42" x2="498" y2="77" marker-end="url(#a-ev)"/><text class="t2" x="508" y="54" text-anchor="start">事件</text>
<rect class="box" x="360" y="81" width="72" height="30" rx="7"/><text class="t" x="396" y="100.5" text-anchor="middle">用戶 1</text>
<rect class="box" x="360" y="151" width="72" height="30" rx="7"/><text class="t" x="396" y="170.5" text-anchor="middle">用戶 2</text>
<line class="ev" x1="456" y1="96" x2="434" y2="96" marker-end="url(#a-ev)"/>
<line class="bad" x1="456" y1="166" x2="434" y2="166" marker-end="url(#a-bad)"/>
<text class="t2" x="552" y="170" text-anchor="start">用戶 2 收不到</text></g><text class="t3" x="364" y="216" text-anchor="start">第 2 步：兩台 Server</text><text class="t2" x="364" y="236" text-anchor="start">用戶 2 連在 B，事件卻只到 A，所以用戶 2 什麼</text><text class="t2" x="364" y="255" text-anchor="start">都收不到。</text>
<rect class="card" x="16" y="302" width="312" height="270" rx="10"/>
<g transform="translate(0 0)"><rect class="box-accent" x="236" y="387" width="76" height="44" rx="7"/><text class="t" x="274" y="407" text-anchor="middle">Broker</text><text class="t3" x="274" y="422" text-anchor="middle">Redis 等</text>
<line class="ev" x1="274" y1="318" x2="274" y2="385" marker-end="url(#a-ev)"/>
<text class="t2" x="284" y="332" text-anchor="start">事件</text>
<rect class="box" x="128" y="349" width="84" height="34" rx="7"/><text class="t" x="170" y="370.5" text-anchor="middle">Server A</text>
<line class="ev" x1="236" y1="409" x2="214" y2="366" marker-end="url(#a-ev)"/>
<rect class="box" x="32" y="351" width="72" height="30" rx="7"/><text class="t" x="68" y="370.5" text-anchor="middle">用戶 1</text>
<line class="ev" x1="128" y1="366" x2="106" y2="366" marker-end="url(#a-ev)"/>
<rect class="box" x="128" y="435" width="84" height="34" rx="7"/><text class="t" x="170" y="456.5" text-anchor="middle">Server B</text>
<line class="ev" x1="236" y1="409" x2="214" y2="452" marker-end="url(#a-ev)"/>
<rect class="box" x="32" y="437" width="72" height="30" rx="7"/><text class="t" x="68" y="456.5" text-anchor="middle">用戶 2</text>
<line class="ev" x1="128" y1="452" x2="106" y2="452" marker-end="url(#a-ev)"/></g><text class="t3" x="36" y="502" text-anchor="start">第 3 步：加上 Broker</text><text class="t2" x="36" y="522" text-anchor="start">事件先到 Broker，再廣播給每台 Server，每台</text><text class="t2" x="36" y="541" text-anchor="start">Server 寫給自己手上的連線。</text>
<rect class="card" x="344" y="302" width="312" height="270" rx="10"/>
<g transform="translate(-3 0)"><rect class="box-accent" x="564" y="374" width="76" height="40" rx="7"/><text class="t" x="602" y="398.5" text-anchor="middle">Broker</text>
<rect class="box-dim" x="558" y="426" width="88" height="56" rx="7"/>
<text class="t3" x="602" y="444" text-anchor="middle">連線位置表</text>
<text class="code" x="602" y="462" text-anchor="middle">user-123</text>
<text class="code" x="602" y="476" text-anchor="middle">→ B, C</text>
<line class="line" x1="602" y1="424" x2="602" y2="416" marker-end="url(#a-line)"/>
<rect class="box-dim" x="456" y="319" width="84" height="34" rx="7"/><text class="t-dim" x="498" y="340.5" text-anchor="middle">Server A</text>
<rect class="box" x="456" y="377" width="84" height="34" rx="7"/><text class="t" x="498" y="398.5" text-anchor="middle">Server B</text>
<line class="ev" x1="564" y1="394" x2="542" y2="394" marker-end="url(#a-ev)"/>
<rect class="box" x="360" y="379" width="72" height="30" rx="7"/><text class="t" x="396" y="398.5" text-anchor="middle">user-123</text>
<line class="ev" x1="456" y1="394" x2="434" y2="394" marker-end="url(#a-ev)"/>
<rect class="box" x="456" y="435" width="84" height="34" rx="7"/><text class="t" x="498" y="456.5" text-anchor="middle">Server C</text>
<line class="ev" x1="564" y1="394" x2="542" y2="452" marker-end="url(#a-ev)"/>
<rect class="box" x="360" y="437" width="72" height="30" rx="7"/><text class="t" x="396" y="456.5" text-anchor="middle">user-123</text>
<line class="ev" x1="456" y1="452" x2="434" y2="452" marker-end="url(#a-ev)"/></g><text class="t3" x="364" y="502" text-anchor="start">第 4 步：Server 很多時，先查連線位置表</text><text class="t2" x="364" y="522" text-anchor="start">user-123 連在 B 和 C，所以事件只發給 B、C，</text><text class="t2" x="364" y="541" text-anchor="start">A 不用收。</text>
</svg>
