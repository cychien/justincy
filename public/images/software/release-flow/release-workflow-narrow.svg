<svg xmlns="http://www.w3.org/2000/svg" width="336" height="424" viewBox="0 0 336 424" role="img" aria-label="push 到 main 或手動觸發後，release-please 更新 Release PR，pending 判斷要發什麼，再交給兩個 Release job：stable job 發 stable 並移動 latest，canary job 發 canary 到 next">
<title>push 到 main 或手動觸發後，release-please 更新 Release PR，pending 判斷要發什麼，再交給兩個 Release job：stable job 發 stable 並移動 latest，canary job 發 canary 到 next</title>

<style>
