<svg xmlns="http://www.w3.org/2000/svg" width="672" height="296" viewBox="0 0 672 296" role="img" aria-label="desktop job 依序 build、簽章、公證、上傳到 draft release、檢查檔案齊全，這五步使用者都看不到。最後改成正式 release 並標成 Latest，網站下載連結和 electron-updater 才讀得到新版">
<title>desktop job 依序 build、簽章、公證、上傳到 draft release、檢查檔案齊全，這五步使用者都看不到。最後改成正式 release 並標成 Latest，網站下載連結和 electron-updater 才讀得到新版</title>

<style>
  .bg { fill: #fafafa; }
  .card { fill: #ffffff; stroke: #e4e4e7; }
  .box { fill: #ffffff; stroke: #a1a1aa; stroke-width: 1.25; }
  .box-dim { fill: #fafafa; stroke: #d4d4d8; stroke-width: 1.25; stroke-dasharray: 4 3; }
  .box-accent { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.25; }
  .group { fill: none; stroke: #a1a1aa; stroke-width: 1.25; stroke-dasharray: 4 3; }
  .group-accent { fill: #2563eb; fill-opacity: 0.05; stroke: #2563eb; stroke-width: 1.25; stroke-dasharray: 4 3; }
  .t { fill: #18181b; font: 500 13px -apple-system, BlinkMacSystemFont, 'PingFang TC', 'Noto Sans TC', 'Microsoft JhengHei', sans-serif; }
  .t-strong { fill: #18181b; font: 600 14px -apple-system, BlinkMacSystemFont, 'PingFang TC', 'Noto Sans TC', 'Microsoft JhengHei', sans-serif; }
  .t2 { fill: #52525b; font: 400 12.5px -apple-system, BlinkMacSystemFont, 'PingFang TC', 'Noto Sans TC', 'Microsoft JhengHei', sans-serif; }
  .t3 { fill: #a1a1aa; font: 400 11.5px -apple-system, BlinkMacSystemFont, 'PingFang TC', 'Noto Sans TC', 'Microsoft JhengHei', sans-serif; }
  .t-acc { fill: #2563eb; font: 600 12.5px -apple-system, BlinkMacSystemFont, 'PingFang TC', 'Noto Sans TC', 'Microsoft JhengHei', sans-serif; }
  .t-dim { fill: #a1a1aa; font: 500 13px -apple-system, BlinkMacSystemFont, 'PingFang TC', 'Noto Sans TC', 'Microsoft JhengHei', sans-serif; }
  .code { fill: #52525b; font: 400 11.5px ui-monospace, SFMono-Regular, Menlo, monospace; }
  .code-acc { fill: #2563eb; font: 600 11.5px ui-monospace, SFMono-Regular, Menlo, monospace; }
  .life { stroke: #d4d4d8; stroke-width: 1.25; stroke-dasharray: 3 3; }
  .axis { stroke: #d4d4d8; stroke-width: 1; }
  .line { stroke: #71717a; stroke-width: 1.5; fill: none; }
  .line-dim { stroke: #d4d4d8; stroke-width: 1.5; fill: none; }
  .ev { stroke: #2563eb; stroke-width: 1.75; fill: none; }
  .line-dash { stroke: #a1a1aa; stroke-width: 1.5; fill: none; stroke-dasharray: 5 4; }
  .dot { fill: #2563eb; }
  .dot-line { fill: #71717a; }
  .dot-hollow { fill: #ffffff; stroke: #d4d4d8; stroke-width: 1.5; }
  .head-line { fill: #71717a; }
  .head-ev { fill: #2563eb; }
  .head-dim { fill: #d4d4d8; }
  .mask { fill: #ffffff; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #18181b; }
    .card { fill: #09090b; stroke: #27272a; }
    .box { fill: #18181b; stroke: #52525b; }
    .box-dim { fill: #18181b; stroke: #3f3f46; }
    .box-accent { fill: #172554; stroke: #3b82f6; }
    .group { stroke: #52525b; }
    .group-accent { fill: #3b82f6; fill-opacity: 0.08; stroke: #3b82f6; }
    .t, .t-strong { fill: #fafafa; }
    .t2, .code { fill: #a1a1aa; }
    .t3, .t-dim { fill: #71717a; }
    .t-acc, .code-acc { fill: #60a5fa; }
    .life, .axis { stroke: #3f3f46; }
    .line { stroke: #a1a1aa; }
    .line-dim { stroke: #52525b; }
    .ev { stroke: #3b82f6; }
    .line-dash { stroke: #71717a; }
    .dot { fill: #3b82f6; }
    .dot-line { fill: #a1a1aa; }
    .dot-hollow { fill: #09090b; stroke: #52525b; }
    .head-line { fill: #a1a1aa; }
    .head-ev { fill: #3b82f6; }
    .head-dim { fill: #52525b; }
    .mask { fill: #09090b; }
  }
</style>
<defs>
  <marker id="a-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head-line" d="M0 0 L10 5 L0 10 z"/></marker>
  <marker id="a-ev" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head-ev" d="M0 0 L10 5 L0 10 z"/></marker>
  <marker id="a-dim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head-dim" d="M0 0 L10 5 L0 10 z"/></marker>
</defs>

<rect class="bg" width="672" height="296"/>
<rect class="card" x="16" y="16" width="640" height="264" rx="10"/>
<text class="t-strong" x="36" y="44" text-anchor="start">desktop job</text>
<rect class="group" x="26" y="76" width="508" height="104" rx="10"/>
<rect class="box" x="36" y="92" width="82" height="48" rx="7"/>
<text class="t" x="77.0" y="120.5" text-anchor="middle">Build</text>
<text class="t3" x="77" y="162" text-anchor="middle">dmg、zip、yml</text>
<rect class="box" x="140" y="92" width="82" height="48" rx="7"/>
<text class="t" x="181.0" y="120.5" text-anchor="middle">簽章</text>
<text class="t3" x="181" y="162" text-anchor="middle">Developer ID</text>
<line class="line" x1="120" y1="116" x2="138" y2="116" marker-end="url(#a-line)"/>
<rect class="box" x="244" y="92" width="82" height="48" rx="7"/>
<text class="t" x="285.0" y="120.5" text-anchor="middle">公證</text>
<text class="t3" x="285" y="162" text-anchor="middle">送 Apple 掃描</text>
<line class="line" x1="224" y1="116" x2="242" y2="116" marker-end="url(#a-line)"/>
<rect class="box" x="348" y="92" width="82" height="48" rx="7"/>
<text class="t" x="389.0" y="112.5" text-anchor="middle">上傳到</text>
<text class="t" x="389.0" y="128.5" text-anchor="middle">draft</text>
<text class="t3" x="389" y="162" text-anchor="middle">對外看不到</text>
<line class="line" x1="328" y1="116" x2="346" y2="116" marker-end="url(#a-line)"/>
<rect class="box" x="452" y="92" width="82" height="48" rx="7"/>
<text class="t" x="493.0" y="112.5" text-anchor="middle">檢查檔案</text>
<text class="t" x="493.0" y="128.5" text-anchor="middle">齊全</text>
<text class="t3" x="493" y="162" text-anchor="middle">三種檔案都在</text>
<line class="line" x1="432" y1="116" x2="450" y2="116" marker-end="url(#a-line)"/>
<rect class="box-accent" x="556" y="92" width="82" height="48" rx="7"/>
<text class="t-acc" x="597.0" y="112.5" text-anchor="middle">改成正式</text>
<text class="t-acc" x="597.0" y="128.5" text-anchor="middle">release</text>
<text class="t-acc" x="597" y="162" text-anchor="middle">標成 Latest</text>
<line class="ev" x1="536" y1="116" x2="554" y2="116" marker-end="url(#a-ev)"/>
<text class="t3" x="280" y="200" text-anchor="middle">前五步使用者都看不到</text>
<line class="ev" x1="597" y1="172" x2="597" y2="206" marker-end="url(#a-ev)"/>
<rect class="box" x="518" y="208" width="120" height="44" rx="7"/>
<text class="t2" x="578.0" y="226.5" text-anchor="middle">網站下載連結</text>
<text class="t2" x="578.0" y="242.5" text-anchor="middle">electron-updater</text>
</svg>
