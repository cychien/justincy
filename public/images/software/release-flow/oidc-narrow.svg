<rect class="mask" x="80.0" y="161" width="72" height="18"/>
<text class="t2" x="116.0" y="174" text-anchor="middle">簽好的 JWT</text>
<line class="line" x1="70" y1="230" x2="256" y2="230" marker-end="url(#a-line)"/>
<rect class="mask" x="99.0" y="209" width="128" height="18"/>
<text class="code" x="163.0" y="222" text-anchor="middle">npm publish ＋ JWT</text>
<line class="ev" x1="256" y1="326" x2="70" y2="326" marker-end="url(#a-ev)"/>
<rect class="mask" x="108.0" y="305" width="110" height="18"/>
<text class="t-acc" x="163.0" y="318" text-anchor="middle">短期 publish 權限</text>
<line class="ev" x1="70" y1="374" x2="256" y2="374" marker-end="url(#a-ev)"/>
<rect class="mask" x="88.0" y="353" width="150" height="18"/>
<text class="code" x="163.0" y="366" text-anchor="middle">tarball ＋ provenance</text>
<rect class="box" x="206.0" y="250" width="104" height="44" rx="7"/>
<text class="t" x="258.0" y="268.5" text-anchor="middle">比對 trusted</text>
<text class="t" x="258.0" y="284.5" text-anchor="middle">publisher 設定</text>
</svg>
