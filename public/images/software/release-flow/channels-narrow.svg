  .head-line { fill: #71717a; }
  .head-ev { fill: #2563eb; }
  .head-dim { fill: #d4d4d8; }
  .mask { fill: #ffffff; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #18181b; }
