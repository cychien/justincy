<svg xmlns="http://www.w3.org/2000/svg" width="336" height="324" viewBox="0 0 336 324" role="img" aria-label="main 上有五次 merge。每次 merge 都發一版 canary 到 next；latest 一直停在 0.11.0，直到 merge Release PR 才發出 stable 0.12.0">
<title>main 上有五次 merge。每次 merge 都發一版 canary 到 next；latest 一直停在 0.11.0，直到 merge Release PR 才發出 stable 0.12.0</title>

<style>
