<rect class="mask" x="240.0" y="315" width="160" height="18"/>
<text class="t-acc" x="320.0" y="328" text-anchor="middle">幾分鐘有效的 publish 權限</text>
<line class="ev" x1="106" y1="384" x2="534" y2="384" marker-end="url(#a-ev)"/>
<rect class="mask" x="235.0" y="363" width="170" height="18"/>
<text class="t2" x="320.0" y="376" text-anchor="middle">上傳 tarball ＋ provenance</text>
<rect class="box" x="450.0" y="258" width="172" height="44" rx="7"/>
<text class="t" x="536.0" y="276.5" text-anchor="middle">比對 trusted publisher</text>
<text class="t3" x="536.0" y="292.5" text-anchor="middle">repo、workflow、environment</text>
