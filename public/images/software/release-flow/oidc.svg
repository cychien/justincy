<text class="t" x="320.0" y="77.0" text-anchor="middle">GitHub OIDC</text>
<text class="t3" x="320.0" y="92.0" text-anchor="middle">provider</text>
<line class="life" x1="320" y1="100" x2="320" y2="388"/>
<rect class="box" x="474.0" y="60" width="124" height="40" rx="7"/>
<text class="t" x="536.0" y="84.5" text-anchor="middle">npm registry</text>
<line class="life" x1="536" y1="100" x2="536" y2="388"/>
<line class="line" x1="106" y1="138" x2="318" y2="138" marker-end="url(#a-line)"/>
<rect class="mask" x="157.0" y="117" width="110" height="18"/>
<text class="t2" x="212.0" y="130" text-anchor="middle">要一張 ID token</text>
