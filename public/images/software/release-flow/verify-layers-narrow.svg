<svg xmlns="http://www.w3.org/2000/svg" width="336" height="272" viewBox="0 0 336 272" role="img" aria-label="三層驗證。dry run 照跑判斷和 build，不上傳；canary 真的上傳到 next，latest 不動；第一個 stable 才移動 latest，使用者收到新版">
<title>三層驗證。dry run 照跑判斷和 build，不上傳；canary 真的上傳到 next，latest 不動；第一個 stable 才移動 latest，使用者收到新版</title>

<style>
  .bg { fill: #fafafa; }
  .card { fill: #ffffff; stroke: #e4e4e7; }
  .box { fill: #ffffff; stroke: #a1a1aa; stroke-width: 1.25; }
  .box-dim { fill: #fafafa; stroke: #d4d4d8; stroke-width: 1.25; stroke-dasharray: 4 3; }
  .box-accent { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.25; }
  .group { fill: none; stroke: #a1a1aa; stroke-width: 1.25; stroke-dasharray: 4 3; }
  .group-accent { fill: #2563eb; fill-opacity: 0.05; stroke: #2563eb; stroke-width: 1.25; stroke-dasharray: 4 3; }
  .t { fill: #18181b; font: 500 13px -apple-system, BlinkMacSystemFont, 'PingFang TC', 'Noto Sans TC', 'Microsoft JhengHei', sans-serif; }
  .t-strong { fill: #18181b; font: 600 14px -apple-system, BlinkMacSystemFont, 'PingFang TC', 'Noto Sans TC', 'Microsoft JhengHei', sans-serif; }
  .t2 { fill: #52525b; font: 400 12.5px -apple-system, BlinkMacSystemFont, 'PingFang TC', 'Noto Sans TC', 'Microsoft JhengHei', sans-serif; }
  .t3 { fill: #a1a1aa; font: 400 11.5px -apple-system, BlinkMacSystemFont, 'PingFang TC', 'Noto Sans TC', 'Microsoft JhengHei', sans-serif; }
  .t-acc { fill: #2563eb; font: 600 12.5px -apple-system, BlinkMacSystemFont, 'PingFang TC', 'Noto Sans TC', 'Microsoft JhengHei', sans-serif; }
  .t-dim { fill: #a1a1aa; font: 500 13px -apple-system, BlinkMacSystemFont, 'PingFang TC', 'Noto Sans TC', 'Microsoft JhengHei', sans-serif; }
  .code { fill: #52525b; font: 400 11.5px ui-monospace, SFMono-Regular, Menlo, monospace; }
  .code-acc { fill: #2563eb; font: 600 11.5px ui-monospace, SFMono-Regular, Menlo, monospace; }
  .life { stroke: #d4d4d8; stroke-width: 1.25; stroke-dasharray: 3 3; }
  .axis { stroke: #d4d4d8; stroke-width: 1; }
  .line { stroke: #71717a; stroke-width: 1.5; fill: none; }
  .line-dim { stroke: #d4d4d8; stroke-width: 1.5; fill: none; }
  .ev { stroke: #2563eb; stroke-width: 1.75; fill: none; }
  .line-dash { stroke: #a1a1aa; stroke-width: 1.5; fill: none; stroke-dasharray: 5 4; }
  .dot { fill: #2563eb; }
  .dot-line { fill: #71717a; }
  .dot-hollow { fill: #ffffff; stroke: #d4d4d8; stroke-width: 1.5; }
  .head-line { fill: #71717a; }
  .head-ev { fill: #2563eb; }
  .head-dim { fill: #d4d4d8; }
  .mask { fill: #ffffff; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #18181b; }
    .card { fill: #09090b; stroke: #27272a; }
    .box { fill: #18181b; stroke: #52525b; }
    .box-dim { fill: #18181b; stroke: #3f3f46; }
    .box-accent { fill: #172554; stroke: #3b82f6; }
    .group { stroke: #52525b; }
    .group-accent { fill: #3b82f6; fill-opacity: 0.08; stroke: #3b82f6; }
    .t, .t-strong { fill: #fafafa; }
    .t2, .code { fill: #a1a1aa; }
    .t3, .t-dim { fill: #71717a; }
    .t-acc, .code-acc { fill: #60a5fa; }
    .life, .axis { stroke: #3f3f46; }
    .line { stroke: #a1a1aa; }
    .line-dim { stroke: #52525b; }
    .ev { stroke: #3b82f6; }
    .line-dash { stroke: #71717a; }
    .dot { fill: #3b82f6; }
    .dot-line { fill: #a1a1aa; }
    .dot-hollow { fill: #09090b; stroke: #52525b; }
    .head-line { fill: #a1a1aa; }
    .head-ev { fill: #3b82f6; }
    .head-dim { fill: #52525b; }
    .mask { fill: #09090b; }
  }
</style>
<defs>
  <marker id="a-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head-line" d="M0 0 L10 5 L0 10 z"/></marker>
  <marker id="a-ev" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head-ev" d="M0 0 L10 5 L0 10 z"/></marker>
  <marker id="a-dim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head-dim" d="M0 0 L10 5 L0 10 z"/></marker>
</defs>

<rect class="bg" width="336" height="272"/>
<rect class="card" x="16" y="16" width="304" height="240" rx="10"/>
<text class="t-strong" x="32" y="44" text-anchor="start">三層驗證</text>
<text class="t3" x="138" y="76" text-anchor="middle">判斷</text>
<text class="t3" x="186" y="76" text-anchor="middle">build</text>
<text class="t3" x="234" y="76" text-anchor="middle">上傳</text>
<text class="t3" x="282" y="76" text-anchor="middle">latest</text>
<text class="t" x="32" y="108.5" text-anchor="start">1. dry run</text>
<text class="t3" x="32" y="124.5" text-anchor="start">使用者看不到</text>
<rect class="box-accent" x="116" y="92" width="44" height="40" rx="7"/>
<text class="t-acc" x="138.0" y="116.5" text-anchor="middle">照跑</text>
<rect class="box-accent" x="164" y="92" width="44" height="40" rx="7"/>
<text class="t-acc" x="186.0" y="116.5" text-anchor="middle">照跑</text>
<rect class="box-dim" x="212" y="92" width="44" height="40" rx="7"/>
<text class="t3" x="234.0" y="116.5" text-anchor="middle">不傳</text>
<rect class="box-dim" x="260" y="92" width="44" height="40" rx="7"/>
<text class="t3" x="282.0" y="116.5" text-anchor="middle">不動</text>
<text class="t" x="32" y="160.5" text-anchor="start">2. canary</text>
<text class="t3" x="32" y="176.5" text-anchor="start">使用者看不到</text>
<rect class="box-accent" x="116" y="144" width="44" height="40" rx="7"/>
<text class="t-acc" x="138.0" y="168.5" text-anchor="middle">照跑</text>
<rect class="box-accent" x="164" y="144" width="44" height="40" rx="7"/>
<text class="t-acc" x="186.0" y="168.5" text-anchor="middle">照跑</text>
<rect class="box-accent" x="212" y="144" width="44" height="40" rx="7"/>
<text class="t-acc" x="234.0" y="168.5" text-anchor="middle">next</text>
<rect class="box-dim" x="260" y="144" width="44" height="40" rx="7"/>
<text class="t3" x="282.0" y="168.5" text-anchor="middle">不動</text>
<text class="t" x="32" y="212.5" text-anchor="start">3. stable</text>
<text class="t-acc" x="32" y="228.5" text-anchor="start">使用者收到</text>
<rect class="box-accent" x="116" y="196" width="44" height="40" rx="7"/>
<text class="t-acc" x="138.0" y="220.5" text-anchor="middle">照跑</text>
<rect class="box-accent" x="164" y="196" width="44" height="40" rx="7"/>
<text class="t-acc" x="186.0" y="220.5" text-anchor="middle">照跑</text>
<rect class="box-accent" x="212" y="196" width="44" height="40" rx="7"/>
<text class="t-acc" x="234.0" y="220.5" text-anchor="middle">上傳</text>
<rect class="box-accent" x="260" y="196" width="44" height="40" rx="7"/>
<text class="t-acc" x="282.0" y="220.5" text-anchor="middle">移動</text>
</svg>
