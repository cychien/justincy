<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aurora pill button</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: #000;
    display: grid;
    place-content: center;
    gap: 72px;
    justify-items: center;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", "Helvetica Neue", sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .aurora-btn {
    --h: 112px;
    position: relative;
    isolation: isolate;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    height: var(--h);
    min-width: calc(var(--h) * 2.95);
    padding: 0 calc(var(--h) * 0.46);
    border: 0;
    border-radius: 999px;
    background:
      radial-gradient(ellipse 55% 90% at 50% 0%, rgb(255 255 255 / 0.07), transparent 70%),
      linear-gradient(#0b0b0b, #050505);
    color: #fff;
    font: inherit;
    font-size: calc(var(--h) * 0.42);
    font-weight: 500;
    letter-spacing: -0.035em;
    cursor: pointer;
    overflow: hidden;
    box-shadow: 0 calc(var(--h) * 0.18) calc(var(--h) * 0.5) -0.2em rgb(0 0 0 / 0.9);
    transition:
      width 520ms cubic-bezier(0.32, 0.72, 0, 1),
      transform 160ms cubic-bezier(0.2, 0, 0, 1);
    -webkit-tap-highlight-color: transparent;
  }
  .aurora-btn:active { transform: scale(0.975); }
  .aurora-btn:focus-visible { outline: 2px solid rgb(255 255 255 / 0.7); outline-offset: 4px; }

  .aurora-btn::after {
    content: "";
    position: absolute;
    inset: 0;
    z-index: 2;
    border-radius: inherit;
    padding: max(1px, calc(var(--h) * 0.013));
    background: linear-gradient(
      to bottom,
      rgb(255 255 255 / 0.30),
      rgb(255 255 255 / 0.14) 45%,
      rgb(255 255 255 / 0.62)
    );
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    pointer-events: none;
    transition: opacity 300ms ease;
  }

  .aurora {
    position: absolute;
    inset: 0;
    z-index: 0;
    border-radius: inherit;
    overflow: hidden;
    opacity: 0.85;
    transition: opacity 400ms ease, transform 600ms cubic-bezier(0.32, 0.72, 0, 1);
    transform-origin: 50% 100%;
    pointer-events: none;
  }
  .aurora-btn:hover .aurora { opacity: 1; transform: scaleY(1.12); }

  .blob {
    position: absolute;
    bottom: 0;
    border-radius: 50%;
    mix-blend-mode: screen;
    will-change: transform;
  }
  .blob.warm {
    left: -6%;
    width: 62%;
    height: 95%;
    translate: 0 45%;
    background: radial-gradient(closest-side, rgb(224 120 80 / 0.85), rgb(170 74 52 / 0.35) 55%, transparent);
    filter: blur(calc(var(--h) * 0.09));
    animation: drift-warm 7s cubic-bezier(0.45, 0, 0.55, 1) infinite alternate;
  }
  .blob.cool {
    right: -6%;
    width: 60%;
    height: 95%;
    translate: 0 45%;
    background: radial-gradient(closest-side, rgb(104 132 240 / 0.9), rgb(60 80 180 / 0.35) 55%, transparent);
    filter: blur(calc(var(--h) * 0.09));
    animation: drift-cool 8s cubic-bezier(0.45, 0, 0.55, 1) infinite alternate;
  }
  .blob.mint {
    left: 40%;
    width: 38%;
    height: 60%;
    translate: 0 40%;
    background: radial-gradient(closest-side, rgb(150 210 190 / 0.45), transparent);
    filter: blur(calc(var(--h) * 0.08));
    animation: drift-mint 6s cubic-bezier(0.45, 0, 0.55, 1) infinite alternate;
  }
  .blob.core {
    left: 28%;
    width: 44%;
    height: 44%;
    translate: 0 50%;
    background: radial-gradient(closest-side, #fff, rgb(255 255 255 / 0.85) 45%, rgb(255 255 255 / 0.15) 80%, transparent);
    filter: blur(calc(var(--h) * 0.02));
    animation: drift-core 5s cubic-bezier(0.45, 0, 0.55, 1) infinite alternate;
  }
  .blob.halo {
    left: 18%;
    width: 64%;
    height: 90%;
    translate: 0 45%;
    background: radial-gradient(closest-side, rgb(255 255 255 / 0.4), transparent);
    filter: blur(calc(var(--h) * 0.08));
    animation: drift-core 5s cubic-bezier(0.45, 0, 0.55, 1) infinite alternate;
  }

  @keyframes drift-warm {
    0%   { transform: translateX(0) scale(1, 1); }
    50%  { transform: translateX(30%) scale(1.15, 0.9); }
    100% { transform: translateX(85%) scale(0.95, 1.05); }
  }
  @keyframes drift-cool {
    0%   { transform: translateX(0) scale(1, 1); }
    50%  { transform: translateX(-35%) scale(1.1, 1.05); }
    100% { transform: translateX(-90%) scale(1, 0.95); }
  }
  @keyframes drift-mint {
    0%   { transform: translateX(0); opacity: 0.6; }
    100% { transform: translateX(-40%); opacity: 1; }
  }
  @keyframes drift-core {
    0%   { transform: translateX(-6%) scale(1.05, 1); opacity: 1; }
    60%  { transform: translateX(8%) scale(0.85, 0.9); opacity: 0.7; }
    100% { transform: translateX(-2%) scale(0.7, 0.75); opacity: 0.45; }
  }

  .label {
    position: relative;
    z-index: 1;
    width: 0;
    height: 1lh;
    white-space: nowrap;
  }
  .label > span {
    position: absolute;
    left: 50%;
    top: 0;
    translate: -50% 0;
    transition:
      opacity 360ms ease,
      filter 360ms ease,
      transform 520ms cubic-bezier(0.32, 0.72, 0, 1);
  }
  .label > span[aria-hidden="true"] {
    opacity: 0;
    filter: blur(6px);
    transform: translateY(18%) scale(0.96);
  }

  .aurora-btn.sm { --h: 48px; }

  .hint {
    color: rgb(255 255 255 / 0.32);
    font-size: 13px;
    letter-spacing: 0.01em;
  }

  @media (prefers-reduced-motion: reduce) {
    .blob { animation: none; }
    .aurora-btn, .label > span { transition-duration: 1ms; }
  }
</style>
</head>
<body>
  <button class="aurora-btn" type="button" data-labels="Siri AI.|More powerful.">
    <span class="aurora" aria-hidden="true">
      <span class="blob warm"></span>
      <span class="blob cool"></span>
      <span class="blob mint"></span>
      <span class="blob halo"></span>
      <span class="blob core"></span>
    </span>
    <span class="label"></span>
  </button>

  <button class="aurora-btn sm" type="button" data-labels="開始對話|Talk to me">
    <span class="aurora" aria-hidden="true">
      <span class="blob warm"></span>
      <span class="blob cool"></span>
      <span class="blob mint"></span>
      <span class="blob halo"></span>
      <span class="blob core"></span>
    </span>
    <span class="label"></span>
  </button>

  <div class="hint">點擊按鈕切換文字</div>

<script>
  for (const button of document.querySelectorAll(".aurora-btn")) {
    const labels = button.dataset.labels.split("|");
    const label = button.querySelector(".label");
    const spans = labels.map((text, i) => {
      const span = document.createElement("span");
      span.textContent = text;
      if (i > 0) span.setAttribute("aria-hidden", "true");
      label.append(span);
      return span;
    });
    let active = 0;

    const widthFor = (span) => {
      const style = getComputedStyle(button);
      const padding = parseFloat(style.paddingLeft) + parseFloat(style.paddingRight);
      return Math.max(span.offsetWidth + padding, parseFloat(style.minWidth));
    };

    button.style.width = `${widthFor(spans[active])}px`;

    button.addEventListener("click", () => {
      spans[active].setAttribute("aria-hidden", "true");
      active = (active + 1) % spans.length;
      spans[active].removeAttribute("aria-hidden");
      button.style.width = `${widthFor(spans[active])}px`;
    });
  }
</script>
</body>
</html>
